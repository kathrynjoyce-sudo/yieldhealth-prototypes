<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yield Health — TEAM Episode KPI Dashboard</title>
<style>
  :root {
    --navy:       #1E4B3A;
    --blue:       #8FA687;
    --blue-light: #EEF3EC;
    --green:      #166534;
    --green-light:#dcfce7;
    --gold:       #D4A84C;
    --gold-light: #F5EAD3;
    --teal:       #0f766e;
    --teal-light: #ccfbf1;
    --purple:     #6b21a8;
    --purple-light:#f3e8ff;
    --slate:      #545759;
    --slate-mid:  rgba(84,87,89,0.68);
    --slate-light:#F2F2F2;
    --white:      #ffffff;
    --border:     #e2e8f0;
    --red:        #991b1b;
    --red-light:  #fee2e2;
    --amber:      #92400e;
    --amber-light:#fef3c7;

    --font-display: Arial, Helvetica, sans-serif;
    --font-body:    Arial, Helvetica, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    background: #f8fafc;
    color: var(--slate);
    min-height: 100vh;
  }

  .header {
    background: var(--navy);
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(212,168,76,0.22) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(143,166,135,0.28) 0%, transparent 50%);
    padding: 40px 48px 32px;
    position: relative;
    overflow: hidden;
  }
  .header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .header-title { font-family: var(--font-display); font-weight: bold; font-size: 2.4rem; color: #fff; line-height: 1.1; letter-spacing: -0.01em; }
  .header-title em { font-style: italic; color: #D4A84C; }
  .header-sub { margin-top: 8px; font-size: 0.88rem; color: rgba(255,255,255,0.55); font-weight: 400; letter-spacing: 0.04em; text-transform: uppercase; }
  .header-meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .meta-pill { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.8); padding: 6px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.02em; }

  .controls { padding: 20px 48px 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .ctrl-label { font-size: 0.75rem; font-weight: 700; color: var(--slate-mid); letter-spacing: 0.05em; text-transform: uppercase; margin-right: 2px; }
  .filter-btn { padding: 7px 16px; border-radius: 6px; border: 1.5px solid var(--border); background: #fff; color: var(--slate); font-family: var(--font-body); font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .filter-btn:hover { border-color: var(--blue); color: var(--blue); }
  .filter-btn.active { background: var(--navy); border-color: var(--navy); color: #fff; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 20px; padding: 20px 48px 48px; }

  .card { background: #fff; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; transition: box-shadow 0.2s, transform 0.2s; animation: fadeIn 0.3s ease both; }
  .card:hover { box-shadow: 0 8px 32px rgba(26,58,92,0.12); transform: translateY(-2px); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .card.hidden { display: none; }

  .card-header { padding: 16px 20px 14px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .card-title-block {}
  .card-category { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
  .card-name { font-family: var(--font-display); font-weight: bold; font-size: 1.15rem; color: var(--navy); line-height: 1.25; }
  .card-codes { font-size: 0.73rem; color: var(--slate-mid); margin-top: 3px; }
  .card-badges { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; flex-shrink: 0; }
  .badge { padding: 3px 10px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.03em; white-space: nowrap; }

  .kpi-sections { border-top: 1px solid var(--border); }
  .kpi-section { border-bottom: 1px solid var(--border); }
  .kpi-section:last-child { border-bottom: none; }
  .kpi-section-header { padding: 10px 20px 9px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; transition: background 0.15s; }
  .kpi-section-header:hover { background: var(--slate-light); }
  .kpi-section-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; display: flex; align-items: center; gap: 7px; }
  .kpi-section-icon { width: 18px; height: 18px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 800; flex-shrink: 0; }
  .toggle-icon { font-size: 0.7rem; color: var(--slate-mid); transition: transform 0.2s; }
  .toggle-icon.open { transform: rotate(180deg); }

  .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border-top: 1px solid var(--border); }
  .kpi-grid.collapsed { display: none; }
  .kpi-item { background: #fff; padding: 12px 14px; transition: background 0.15s; }
  .kpi-item:hover { background: var(--slate-light); }
  .kpi-item.wide { grid-column: span 3; }
  .kpi-item.two { grid-column: span 2; }
  .kpi-name { font-size: 0.68rem; font-weight: 700; color: var(--slate-mid); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 4px; line-height: 1.3; }
  .kpi-value { font-size: 0.9rem; font-weight: 600; color: var(--slate); line-height: 1.3; }
  .kpi-target { font-size: 0.7rem; color: var(--slate-mid); margin-top: 3px; font-weight: 400; }
  .kpi-target strong { color: var(--green); font-weight: 600; }
  .kpi-flag { display: inline-block; font-size: 0.64rem; font-weight: 700; padding: 1px 6px; border-radius: 3px; margin-top: 4px; letter-spacing: 0.03em; }

  .card-footer { background: var(--slate-light); padding: 10px 20px; font-size: 0.72rem; color: var(--slate-mid); font-style: italic; border-top: 1px solid var(--border); }

  .summary-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; background: #fff; border-bottom: 1px solid var(--border); border-top: 1px solid var(--border); margin: 0 0 0 0; }
  .stat-box { padding: 16px 24px; border-right: 1px solid var(--border); text-align: center; }
  .stat-box:last-child { border-right: none; }
  .stat-num { font-family: var(--font-display); font-weight: bold; font-size: 1.8rem; color: var(--navy); line-height: 1; }
  .stat-num.accent { color: var(--gold); }
  .stat-label { font-size: 0.72rem; color: var(--slate-mid); margin-top: 4px; font-weight: 500; letter-spacing: 0.03em; }

  [title] { cursor: help; }

  @media (max-width: 800px) {
    .header, .controls { padding-left: 20px; padding-right: 20px; }
    .grid { padding: 16px 20px 32px; grid-template-columns: 1fr; }
    .header-title { font-size: 1.6rem; }
    .summary-bar { grid-template-columns: repeat(3, 1fr); }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>

        items: [
          { name: "72-Hr Contact Rate", value: "% reached within 72 hrs", target: "Target: ≥90%", flag: "Compassionate Care KPI", flagColor: "#6b21a8", flagBg: "#f3e8ff" },
          { name: "Ostomy Emotional Support Check Rate", value: "% ostomy patients with emotional check at Day 7", target: "Target: 100%", flag: null },
          { name: "Patient NPS", value: "Post-episode score", target: "Target: ≥55", flag: null },
        ]
      }
    ]
  },

]; // end data

const acuityStyle = {
  "Emergent":             { bg: "#fee2e2", color: "#991b1b" },
  "Urgent":               { bg: "#F5EAD3", color: "#D4A84C" },
  "Scheduled":            { bg: "#dcfce7", color: "#166534" },
  "Urgent / Emergent":    { bg: "#fee2e2", color: "#991b1b" },
  "Emergent / Urgent":    { bg: "#fee2e2", color: "#991b1b" },
  "Urgent / Scheduled":   { bg: "#F5EAD3", color: "#D4A84C" },
  "Emergent / Urgent / Scheduled": { bg: "#F5EAD3", color: "#D4A84C" },
};
const mandateStyle = {
  "Mandatory":            { bg: "#fee2e2", color: "#991b1b" },
  "Elective":             { bg: "#dcfce7", color: "#166534" },
  "Mandatory / Elective": { bg: "#F5EAD3", color: "#D4A84C" },
  "Both":                 { bg: "#F5EAD3", color: "#D4A84C" },
};

function badgePill(text, style) {
  const s = style || { bg: "#f1f5f9", color: "#64748b" };
  return `<span class="badge" style="background:${s.bg};color:${s.color}">${text}</span>`;
}

function buildCard(ep, idx) {
  const as = acuityStyle[ep.acuity] || { bg: "#F5EAD3", color: "#D4A84C" };
  const ms = mandateStyle[ep.mandate] || { bg: "#f1f5f9", color: "#64748b" };

  const kpiSections = ep.kpis.map((sec, si) => {
    const items = sec.items.map(item => {
      const flag = item.flag
        ? `<div><span class="kpi-flag" style="background:${item.flagBg};color:${item.flagColor}">${item.flag}</span></div>` : '';
      return `<div class="kpi-item">
        <div class="kpi-name">${item.name}</div>
        <div class="kpi-value">${item.value}</div>
        <div class="kpi-target"><strong>→</strong> ${item.target}</div>
        ${flag}
      </div>`;
    }).join('');

    return `
    <div class="kpi-section">
      <div class="kpi-section-header" onclick="toggleSection(this)">
        <div class="kpi-section-title">
          <div class="kpi-section-icon" style="background:${sec.iconBg};color:${sec.iconColor}">${sec.icon}</div>
          <span style="color:${sec.color}">${sec.section}</span>
          <span style="font-size:0.7rem;color:#94a3b8;font-weight:400">(${sec.items.length} KPIs)</span>
        </div>
        <span class="toggle-icon open">▲</span>
      </div>
      <div class="kpi-grid">
        ${items}
      </div>
    </div>`;
  }).join('');

  return `
  <div class="card" data-cat="${ep.catKey}" style="animation-delay:${idx * 0.03}s">
    <div class="card-header" style="background:${ep.catLight}">
      <div class="card-title-block">
        <div class="card-category" style="color:${ep.catColor}">${ep.cat}</div>
        <div class="card-name">${ep.name}</div>
        <div class="card-codes">${ep.codes}</div>
      </div>
      <div class="card-badges">
        ${badgePill(ep.acuity, as)}
        ${badgePill(ep.mandate, ms)}
        ${badgePill(ep.epType, { bg: "#f8fafc", color: "#334155" })}
      </div>
    </div>
    <div class="kpi-sections">
      ${kpiSections}
    </div>
    <div class="card-footer">${ep.footer}</div>
  </div>`;
}

const grid = document.getElementById('episodeGrid');
grid.innerHTML = episodes.map((ep, i) => buildCard(ep, i)).join('');

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.filter;
    document.querySelectorAll('.card').forEach(card => {
      if (f === 'all' || card.dataset.cat === f) {
        card.classList.remove('hidden');
        card.style.animationDelay = '0s';
      } else {
        card.classList.add('hidden');
      }
    });
  });
});

function toggleSection(header) {
  const grid = header.nextElementSibling;
  const icon = header.querySelector('.toggle-icon');
  const collapsed = grid.classList.toggle('collapsed');
  icon.classList.toggle('open', !collapsed);
}
</script>
</body>
</html>
